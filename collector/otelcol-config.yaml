# OpenTelemetry Collector — IBM MQ O11y lab → Splunk Observability Cloud
# Requires .env.splunk with SPLUNK_ACCESS_TOKEN, SPLUNK_REALM, SPLUNK_INGEST_URL, SPLUNK_API_URL

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
  resource/add_environment:
    attributes:
      - key: deployment.environment.name
        value: ${DEPLOYMENT_ENVIRONMENT}
        action: upsert
      - key: deployment.environment
        value: ${DEPLOYMENT_ENVIRONMENT}
        action: upsert
      - key: demo.name
        value: ibm-mq-o11y-lab
        action: upsert
  transform/mq_metrics_environment:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["deployment.environment"], "ibm-mq-lab")
          - set(attributes["deployment.environment.name"], "ibm-mq-lab")

exporters:
  otlphttp/traces:
    traces_endpoint: ${SPLUNK_INGEST_URL}/v2/trace/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}
  splunk_hec/o11y:
    token: ${SPLUNK_ACCESS_TOKEN}
    endpoint: ${SPLUNK_LOG_INGEST_URL}
    source: ibm-mq-o11y-lab
    sourcetype: otel
  signalfx:
    access_token: ${SPLUNK_ACCESS_TOKEN}
    realm: ${SPLUNK_REALM}
    ingest_url: ${SPLUNK_INGEST_URL}
    api_url: ${SPLUNK_API_URL}
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [otlphttp/traces, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, transform/mq_metrics_environment, batch]
      exporters: [signalfx, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/add_environment, batch]
      exporters: [splunk_hec/o11y, debug]
